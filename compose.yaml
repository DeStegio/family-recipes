name: family-recipes
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 2s
      timeout: 3s
      retries: 15
  s3:
    image: chrislusf/seaweedfs:4.22
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: family-recipes-local
      AWS_SECRET_ACCESS_KEY: family-recipes-dev-only
      S3_BUCKET: family-recipes-local
    ports:
      - "127.0.0.1:54566:8333"
    volumes:
      - originals:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres:
  originals:
